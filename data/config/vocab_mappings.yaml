# =============================================================================
# AgriNexus AI — Vocabulary canonicalisation
# =============================================================================
# The KB files use different vocabularies for the same concept. This file maps
# every KB spelling to a canonical value used inside the engines. The original
# strings are never rewritten in the CSVs; the loader adds *_canonical columns.
# =============================================================================
version: 1

# -----------------------------------------------------------------------------
# SOIL  — canonical: alluvial | black | red | laterite | sandy | clay | loam |
#                    saline_alkaline
# -----------------------------------------------------------------------------
soil:
  canonical:
    alluvial:        {label: "Alluvial Soil",            texture: "loam",        drainage: "good",     fertility: "high"}
    black:           {label: "Black Soil (Regur)",       texture: "clay",        drainage: "poor",     fertility: "high"}
    red:             {label: "Red Soil",                 texture: "sandy_loam",  drainage: "good",     fertility: "low"}
    laterite:        {label: "Laterite Soil",            texture: "clay_loam",   drainage: "good",     fertility: "low"}
    sandy:           {label: "Sandy / Sandy Loam Soil",  texture: "sandy",       drainage: "excessive",fertility: "low"}
    clay:            {label: "Clay / Clay Loam Soil",    texture: "clay",        drainage: "poor",     fertility: "medium"}
    loam:            {label: "Loamy Soil",               texture: "loam",        drainage: "good",     fertility: "medium"}
    saline_alkaline: {label: "Saline / Alkaline Soil",   texture: "variable",    drainage: "poor",     fertility: "low"}
  aliases:
    "Alluvial Soil": alluvial
    "Black Soil (Regur)": black
    "Black Soil": black
    "Black Cotton Soil": black
    "Regur": black
    "Red Soil": red
    "Red Sandy Soil": red
    "Laterite Soil": laterite
    "Sandy Loam Soil": sandy
    "Sandy Soil": sandy
    "Clay Loam Soil": clay
    "Clay Soil": clay
    "Well-Drained Loamy Soil": loam
    "Loamy Soil": loam
    "Loam": loam
    "Saline / Alkaline Tolerant Soil": saline_alkaline
    "Saline / Alkaline Soil": saline_alkaline
    "Saline Soil": saline_alkaline
    "Alkaline Soil": saline_alkaline
  # Suitability of a crop's preferred soil (row) when the farm has soil (col).
  # 1.0 = same canonical class. Used by the crop advisor as a soft score.
  similarity:
    alluvial:        {alluvial: 1.0, loam: 0.85, sandy: 0.6, clay: 0.6, black: 0.5, red: 0.5, laterite: 0.3, saline_alkaline: 0.2}
    black:           {black: 1.0, clay: 0.8, alluvial: 0.5, loam: 0.5, red: 0.4, laterite: 0.3, sandy: 0.2, saline_alkaline: 0.3}
    red:             {red: 1.0, laterite: 0.7, sandy: 0.7, loam: 0.6, alluvial: 0.5, black: 0.4, clay: 0.3, saline_alkaline: 0.2}
    laterite:        {laterite: 1.0, red: 0.7, loam: 0.5, sandy: 0.5, clay: 0.4, alluvial: 0.3, black: 0.3, saline_alkaline: 0.2}
    sandy:           {sandy: 1.0, red: 0.7, loam: 0.7, alluvial: 0.6, laterite: 0.5, black: 0.2, clay: 0.2, saline_alkaline: 0.3}
    clay:            {clay: 1.0, black: 0.8, loam: 0.6, alluvial: 0.6, laterite: 0.4, red: 0.3, sandy: 0.2, saline_alkaline: 0.3}
    loam:            {loam: 1.0, alluvial: 0.85, sandy: 0.7, clay: 0.6, red: 0.6, black: 0.5, laterite: 0.5, saline_alkaline: 0.2}
    saline_alkaline: {saline_alkaline: 1.0, black: 0.3, clay: 0.3, sandy: 0.3, alluvial: 0.2, loam: 0.2, red: 0.2, laterite: 0.2}

