# -----------------------------------------------------------------------------
# LAND BANDS — as used in ai_recommendation_rules.condition_json (acres)
# -----------------------------------------------------------------------------
land_bands:
  - {label: "<2 Acres",   min: 0,  max: 2}
  - {label: "2-5 Acres",  min: 2,  max: 5}
  - {label: "5-10 Acres", min: 5,  max: 10}
  - {label: ">10 Acres",  min: 10, max: null}
  # coarse band used by some rules; a farm matches it if land < 5
  - {label: "<5 Acres",   min: 0,  max: 5}

# -----------------------------------------------------------------------------
# INCOME BANDS — annual household income, INR
# -----------------------------------------------------------------------------
income_bands:
  - {label: "<200000",        min: 0,      max: 200000}
  - {label: "200000-300000",  min: 200000, max: 300000}
  - {label: "300000-500000",  min: 300000, max: 500000}
  - {label: ">500000",        min: 500000, max: null}
  - {label: "<300000",        min: 0,      max: 300000}

# -----------------------------------------------------------------------------
# FARMER CATEGORY — derived from land holding (hectares, GoI Agricultural
# Census definition) plus profile flags. Mapped to KB spellings.
# -----------------------------------------------------------------------------
farmer_category:
  by_land_hectares:
    - {label: Marginal Farmer, max_ha: 1.0}
    - {label: Small Farmer,    max_ha: 2.0}
    - {label: Medium Farmer,   max_ha: 10.0}     # KB uses "Medium" for semi-medium+medium
    - {label: Large Farmer,    max_ha: null}
  # KB `eligible_farmer` / `beneficiary_type` / `farmer_category` spellings
  # that a farm profile satisfies. Key = canonical profile attribute.
  kb_terms:
    any:
      - All Categories of Farmers
      - Any Registered Farmer
      - All Farmers (Loanee and Non-Loanee)
      - Non-Loanee Farmers (Voluntary Enrolment)
    landowner:
      - Farmers with Valid Land Records
      - Landowning Farmers
      - Landholding Farmer
      - Landholding Farmer Families
      - Landowning Farmers with Revenue Records
      - Tenant & Landowning Farmers
    tenant:
      - Tenant Farmer
      - Tenant & Landowning Farmers
      - Sharecroppers and Tenant Farmers with Valid Certificate
    sharecropper:
      - Sharecropper
      - Sharecroppers with Certificate
      - Sharecroppers and Tenant Farmers with Valid Certificate
    small_marginal:
      - Small & Marginal Farmer
      - Small & Marginal Farmers
      - Small Farmer
      - Marginal Farmer
    medium:
      - Medium Farmer
    large:
      - Large Farmer
    women:
      - Women Farmer
      - Women-headed Farm Households
    fpo_member:
      - Farmer Producer Organisation (FPO)
      - FPO Member Farmer
      - FPO Member Farmers
    horticulture:
      - Horticulture Grower
      - Horticulture Growers with Plantation Records
    loanee:
      - Loanee Farmers (Compulsory Coverage via KCC/Crop Loan)
    livestock:
      - Dairy Farmer
      - Farmers with Registered Livestock and Health Certificate
    fisher:
      - Fisherfolk
    labourer:
      - Agricultural Labourer

# -----------------------------------------------------------------------------
# SEASONS — canonical + month windows (India, approximate)
# -----------------------------------------------------------------------------
seasons:
  Kharif:                 {sowing_months: [6, 7, 8],   label: "Kharif (monsoon)"}
  Rabi:                   {sowing_months: [10, 11, 12], label: "Rabi (winter)"}
  "Zaid (Summer)":        {sowing_months: [2, 3, 4],   label: "Zaid (summer)"}
  "Year-round (Perennial)": {sowing_months: [],          label: "Perennial"}

# -----------------------------------------------------------------------------
# RISK -> insurance covered_risk keywords (used by insurance matcher to link
# detected farm risks to relevant covers)
# -----------------------------------------------------------------------------
risk_to_cover_keywords:
  drought:          [Drought, "Deficit / Excess Rainfall", Water Stress, Dry Spell]
  water_stress:     [Drought, Water Stress, "Deficit / Excess Rainfall"]
  excess_rainfall:  [Excess Rainfall, Flood, Inundation, "Deficit / Excess Rainfall"]
  heat_stress:      [Heat, Temperature, Humidity]
  crop_stress:      [Pest, Disease, Yield]
  hail_storm:       [Hailstorm, Cyclone]
  fire:             [Fire, Lightning]

# -----------------------------------------------------------------------------
# DOCUMENTS — the KB spells the same document several ways across tables.
# Canonical name -> list of KB spellings. Farmer `documents_held` may use any.
# -----------------------------------------------------------------------------
documents:
  canonical:
    "Aadhaar Card": ["Aadhaar Card"]
    "Mobile Number Linked to Aadhaar": ["Mobile Number Linked to Aadhaar", "Mobile Number linked to Aadhaar"]
    "Bank Passbook / Cancelled Cheque": ["Bank Passbook / Cancelled Cheque", "Bank Passbook"]
    "Bank Statement (6 months)": ["Bank Statement (6 months)"]
    "Land Ownership / Pattadar Passbook": ["Land Ownership / Pattadar Passbook", "Land Passbook / Pattadar Passbook"]
    "Tenant Farmer / Sharecropper Certificate": ["Tenant Farmer / Sharecropper Certificate", "Tenant Farmer Certificate"]
    "Voter ID / Address Proof": ["Voter ID / Address Proof", "Voter ID", "Voter ID Card", "Address Proof (Utility Bill)"]
    "Passport Size Photograph": ["Passport Size Photograph", "Passport Size Photographs"]
    "Income Certificate": ["Income Certificate", "Income Proof"]
    "Caste Certificate": ["Caste Certificate"]
    "Ration Card": ["Ration Card"]
    "PAN Card": ["PAN Card"]
    "Soil Health Card": ["Soil Health Card"]
    "Crop Sowing Certificate": ["Crop Sowing Certificate"]
    "FPO / SHG Registration Certificate": ["FPO / SHG Registration Certificate", "FPO Registration Certificate"]
    "Quotation from Authorized Dealer": ["Quotation from Authorized Dealer", "Quotation of Equipment / Machinery"]
    "No Dues Certificate from Other Banks": ["No Dues Certificate from Other Banks", "No Dues Certificate from other Banks"]
    "Existing Loan Statement (if any)": ["Existing Loan Statement (if any)"]
    "Collateral / Security Documents": ["Collateral / Security Documents"]
    "Encumbrance Certificate": ["Encumbrance Certificate"]
    "Bank Guarantee / Surety Bond": ["Bank Guarantee / Surety Bond"]
    "KCC Application Form": ["KCC Application Form"]
    "Insurance Proposal Form": ["Insurance Proposal Form"]
    "Premium Payment Receipt": ["Premium Payment Receipt"]
    "Previous Subsidy Non-Availment Declaration": ["Previous Subsidy Non-Availment Declaration"]
    "Project Report / Detailed Project Report (DPR)": ["Project Report / Detailed Project Report (DPR)"]
    "Village / Revenue Officer Certificate": ["Village / Revenue Officer Certificate"]
    "Water Source Certificate (Borewell/Canal)": ["Water Source Certificate (Borewell/Canal)"]
    "Ear-Tag / Animal Identification Certificate": ["Ear-Tag / Animal Identification Certificate"]
    "Livestock Health & Vaccination Certificate": ["Livestock Health & Vaccination Certificate"]
    "Post-Mortem Report (for Livestock Claims)": ["Post-Mortem Report (for Livestock Claims)"]
  # documents that are implied by profile flags (no need to list in documents_held)
  implied_by_profile:
    has_aadhaar: ["Aadhaar Card", "Mobile Number Linked to Aadhaar"]
    has_bank_account: ["Bank Passbook / Cancelled Cheque"]
    has_soil_health_card: ["Soil Health Card"]
    has_land_records_owner: ["Land Ownership / Pattadar Passbook"]
    is_fpo_member: ["FPO / SHG Registration Certificate"]
  # documents that are forms filled at application time (never "missing" in a blocking sense)
  obtainable_at_application:
    - "KCC Application Form"
    - "Insurance Proposal Form"
    - "Premium Payment Receipt"
    - "Previous Subsidy Non-Availment Declaration"
    - "Passport Size Photograph"
    - "Quotation from Authorized Dealer"
    - "Crop Sowing Certificate"
    - "Bank Statement (6 months)"                 # issued by the farmer's own bank on request
    - "Existing Loan Statement (if any)"
    - "No Dues Certificate from Other Banks"

  # documents that only apply in a specific context; elsewhere they are reported
  # as "not applicable" and excluded from readiness (KB lists them generically).
  conditional:
    livestock:            ["Ear-Tag / Animal Identification Certificate", "Livestock Health & Vaccination Certificate", "Post-Mortem Report (for Livestock Claims)"]
    fpo_member:           ["FPO / SHG Registration Certificate"]
    tenant_or_sharecropper: ["Tenant Farmer / Sharecropper Certificate"]
    collateral_loan:      ["Collateral / Security Documents", "Bank Guarantee / Surety Bond", "Encumbrance Certificate"]
    project_loan:         ["Project Report / Detailed Project Report (DPR)"]

