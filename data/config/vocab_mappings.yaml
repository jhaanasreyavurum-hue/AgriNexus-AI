  "Seed & Planting Material":           {needs: [always]}
  "Farm Mechanization & Equipment":     {needs: [medium_large]}
  "Custom Hiring Centre":               {needs: [small_marginal, fpo_member]}
  "Horticulture & Plantation":          {needs: [horticulture_crop]}
  "Post-Harvest & Storage Infrastructure": {needs: [harvest_near, fpo_member]}
  "Cold Storage & Warehousing":         {needs: [horticulture_crop, fpo_member]}
  "FPO & Cooperative Development":      {needs: [fpo_member]}
