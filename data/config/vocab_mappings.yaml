  food_security:  {"Cereal": 6, "Pulse": 5, "Vegetable": 3}
  low_risk:       {"Pulse": 5, "Cereal": 4, "Oilseed": 3, "Fodder": 2}
  sustainability: {"Pulse": 6, "Fodder": 3, "Cereal": 2, "Oilseed": 2}
