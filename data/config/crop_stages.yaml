# =============================================================================
# AgriNexus AI — Crop growth-stage reference (days after sowing)
# =============================================================================
# SOURCE: general agronomic reference (FAO-56 crop-stage lengths and ICAR crop
# calendars), approximate. Used for the Crop Timeline and for stage-aware
# irrigation logic. NOT part of the client KB; labelled `source: reference`.
# Values are cumulative day boundaries: stage i runs from end of stage i-1 to
# `ends_day`.  Kc = FAO-56 indicative crop coefficient for the stage.
# =============================================================================
version: 1
source: "FAO-56 (Allen et al. 1998) indicative stage lengths; ICAR calendars"

default:
  # generic annual field crop, ~120 days
  stages:
    - {name: Sowing,            ends_day: 7,   kc: 0.40, critical_water: false}
    - {name: Emergence,         ends_day: 20,  kc: 0.50, critical_water: true}
    - {name: Vegetative Growth, ends_day: 55,  kc: 0.85, critical_water: false}
    - {name: Flowering,         ends_day: 80,  kc: 1.10, critical_water: true}
    - {name: Grain Filling,     ends_day: 105, kc: 0.95, critical_water: true}
    - {name: Maturity / Harvest,ends_day: 120, kc: 0.55, critical_water: false}

